name: Update Jailbreak Repo

on:
  push:
    branches:
      - main
    paths:
      - 'debs/**'
  workflow_dispatch: # 允許你手動點擊按鈕執行

jobs:
  update-repo:
    runs-on: ubuntu-latest
    # 給予機器人寫入權限
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 升級到 v4 解決 Node.js 警告

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Generate Packages file
        run: |
          # 掃描並產生索引
          dpkg-scanpackages -m ./debs > Packages
          bzip2 -c Packages > Packages.bz2
          gzip -c Packages > Packages.gz

      - name: Commit and Push changes
        run: |
          git config --global user.name "loksum-bot"
          git config --global user.email "bot@loksum.com"
          git add Packages Packages.bz2 Packages.gz
          # 只有在有變動時才提交，避免報錯
          if [ -n "$(git status --porcelain Packages Packages.bz2 Packages.gz)" ]; then
            git commit -m "自動更新軟體源索引 [$(date)]"
            git push
          else
            echo "沒有檔案變動，跳過提交。"
          fi
