<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Sileo</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f2f2f7;
            font-family: -apple-system, sans-serif;
        }
        .btn {
            display: inline-block;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: 600;
            color: white;
            background-color: #2cccd3; /* Sileo 經典青綠色 */
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(44, 204, 211, 0.3);
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
            background-color: #24b5bb;
        }
    </style>
</head>
<body>

    <a href="sileo://source/https://loksum619.github.io/repo/" class="btn">
        Add to Sileo
    </a>

</body>
</html>
